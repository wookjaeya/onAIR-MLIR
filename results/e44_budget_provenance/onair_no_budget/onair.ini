# Official OnAIR configuration registering this repository's CompiledLearner plugin.
#
# It uses the stock OnAIR schema (compare onair/config/default_config.ini) and does
# NOT modify OnAIR core. The plugin is loaded by NASA's own plugin_import, which
# calls Plugin(construct_name, headers); deployment settings are selected by that
# construct name through ONAIR_MLIR_DEPLOYMENT_CONFIG.
#
# Run from the OnAIR checkout, e.g.
#   ONAIR_MLIR_DEPLOYMENT_CONFIG=<repo>/configs/deployments/onair_deployments.json \
#   python driver.py <repo>/configs/onair_compiled_learner.ini

[FILES]
TelemetryFilePath = /home/user/onAIR-MLIR/configs/onair_data
TelemetryFile = smartcam_replay.csv
MetaFilePath = /home/user/onAIR-MLIR/configs/onair_data
MetaFile = smartcam_replay_CONFIG.json

[DATA_HANDLING]
DataSourceFile = onair/data_handling/csv_parser.py

[PLUGINS]
KnowledgeRepPluginDict = {'generic':'plugins/generic'}
LearnersPluginDict = {'smartcam_no_budget':'/home/user/onAIR-MLIR/plugins/compiled_learner'}
PlannersPluginDict = {'generic':'plugins/generic'}
ComplexPluginDict = {'generic':'plugins/generic'}

[OPTIONS]
IO_Enabled = true
